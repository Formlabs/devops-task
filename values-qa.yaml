---
replicaCount: 2

image:
  tag: latest

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: qa-ca-issuer
  hosts:
    - host: qa.helloapp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: helloapp-tls
      hosts:
        - qa.helloapp.example.com

env:
  - name: APP_DEBUG
    value: "True"