name: CI

on:
  push:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run CI checks
        run: uv run invoke ci

  build:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v2
        with:
          image: helloapp
          tags: latest ${{ github.sha }}
          containerfiles: |
            ./Containerfile

