---
replicaCount: 10


ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: prod-ca-issuer
  hosts:
    - host: helloapp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: helloapp-tls
      hosts:
        - helloapp.example.com

env:
  - name: APP_DEBUG
    value: "False"